services:
  niulai:
    build: .
    image: niulai:latest
    container_name: niulai
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      - TZ=Asia/Shanghai
      - EASTMONEY_COOKIE=${EASTMONEY_COOKIE:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8088/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
